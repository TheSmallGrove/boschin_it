name: Deploy boschin.it to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check translated pages are up to date
        run: |
          python3 tools/build_i18n.py
          git diff --exit-code -- wwwroot/ || {
            echo "::error::Translated pages are out of date: run 'python3 tools/build_i18n.py' and commit the result."
            exit 1
          }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./wwwroot

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
